[versions]
agp = "8.5.2"
kotlin = "1.9.24"
coreKtx = "1.13.1"
lifecycle = "2.8.4"
activityCompose = "1.9.1"
composeBom = "2024.09.00"
hilt = "2.51.1"
hiltNav = "1.2.0"
room = "2.6.1"
okhttp = "4.12.0"
serialization = "1.6.3"
coroutines = "1.8.1"
datastore = "1.1.1"
accompanist = "0.34.0"
coil = "2.6.0"

[libraries]
core-ktx            = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
lifecycle-runtime   = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-service   = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
activity-compose    = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-bom         = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui          = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling  = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3   = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
hilt-android        = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler       = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation     = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNav" }
room-runtime        = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx            = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler       = { module = "androidx.room:room-compiler", version.ref = "room" }
okhttp              = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
serialization-json  = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
coroutines-android  = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
datastore-prefs     = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
accompanist-permissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanist" }
coil-compose        = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
coil-gif            = { module = "io.coil-kt:coil-gif", version.ref = "coil" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt                = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp                 = { id = "com.google.devtools.ksp", version = "2.0.20-1.0.25" }
